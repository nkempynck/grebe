<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Redirect legacy grebe-games.pages.dev visitors to the canonical domain,
      // preserving their path, query, and hash. Fires only on the old host, so
      // grebegames.com is never affected. Allowed by its own CSP hash below.
      if (location.hostname === "grebe-games.pages.dev") {
        location.replace(
          "https://grebegames.com" + location.pathname + location.search + location.hash
        );
      }
    </script>
    <title>Grebe — daily tree-of-life game</title>
    <meta name="description" content="Daily puzzle games played on the tree of life." />

    <!-- Static favicon for crawlers/no-JS; main.tsx swaps in the hashed asset at
         runtime for real browsers. Served from /public. -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Link-preview cards (WhatsApp, iMessage, Slack, social). Crawlers read only
         static HTML, so the image is an absolute URL to a file served at the root. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grebe" />
    <meta property="og:title" content="Grebe — daily tree-of-life games" />
    <meta property="og:description" content="Daily puzzle games played on the tree of life." />
    <meta property="og:url" content="https://grebegames.com" />
    <meta property="og:image" content="https://grebegames.com/logo.png" />
    <meta property="og:image:width" content="2267" />
    <meta property="og:image:height" content="2267" />
    <meta property="og:image:alt" content="The Grebe logo: a drawing of a Great Crested Grebe." />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Grebe — daily tree-of-life games" />
    <meta name="twitter:description" content="Daily puzzle games played on the tree of life." />
    <meta name="twitter:image" content="https://grebegames.com/logo.png" />
    <script>
      // Apply a remembered theme before first paint so a forced choice doesn't
      // flash the OS default. No stored value → CSS drives from prefers-color-scheme.
      try {
        var t = localStorage.getItem("grebe.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script>
      // Recover from a deploy that happened while this page was open or cached.
      // index.html names hashed bundles; a deploy replaces them, and the old paths
      // are gone. Cloudflare Pages answers a missing /assets/* with index.html
      // (200, text/html), so the module script fails its MIME check and nothing
      // renders — a blank page that a plain reload doesn't always clear.
      // A failed script or stylesheet fires an error event on its element, which
      // doesn't bubble, so this listens in the capture phase. index.html is
      // no-cache, so a reload always fetches a fresh list of bundles.
      //
      // Up to three spaced attempts, not one: a deploy takes a few seconds to reach
      // every edge, and an instant retry lands in the same gap it just failed in.
      // The counter lives in sessionStorage and is cleared once the app boots, so a
      // later deploy in the same session gets a fresh budget. If storage is
      // unavailable we do NOT reload at all — without a way to count attempts there
      // is no way to guarantee the loop ends, and a reload loop is far worse than a
      // blank page.
      window.addEventListener(
        "error",
        function (e) {
          var el = e.target;
          if (!el || (el.tagName !== "SCRIPT" && el.tagName !== "LINK")) return;
          // Only OUR hashed bundles. Turnstile's script failing (blocked, offline)
          // is not a stale deploy and must not trigger a reload.
          var url = el.src || el.href || "";
          if (url.lastIndexOf(location.origin + "/assets/", 0) !== 0) return;
          var tries;
          try {
            tries = +(sessionStorage.getItem("grebe.assetReload") || 0);
            sessionStorage.setItem("grebe.assetReload", tries + 1);
          } catch (err) {
            return;
          }
          if (tries >= 3) return;
          setTimeout(function () {
            location.reload();
          }, tries === 0 ? 800 : 2000);
        },
        true
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
